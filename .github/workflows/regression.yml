name: Regression suite

on:
  schedule:
    - cron: "0 2 * * *"   # every day at 02:00 UTC
  workflow_dispatch:        # also allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run regression tests
        run: pytest -m regression --alluredir=allure-results
        env:
          USERNAME: ${{ secrets.APP_USERNAME }}
          PASSWORD: ${{ secrets.APP_PASSWORD }}

      - name: Generate and publish Allure report
        if: always()
        uses: simple-elf/allure-report-action@v1
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history
          subfolder: regression
          keep_reports: 20
          github_repo: ${{ github.repository }}
          github_repo_owner: ${{ github.repository_owner }}
          github_run_num: ${{ github.run_number }}
          github_run_id: ${{ github.run_id }}
          ref: ${{ github.ref_name }}

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          destination_dir: regression
          keep_files: true
